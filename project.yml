name: Nourish
options:
  bundleIdPrefix: com.nourish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Nourish:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Nourish
    info:
      path: Nourish/Info.plist
      properties:
        NSHealthShareUsageDescription: Nourish uses health data to track activity and burned energy.
        NSHealthUpdateUsageDescription: Nourish saves dietary intake and water consumption to Apple Health.
        NSCameraUsageDescription: Nourish needs camera access to scan food barcodes, nutrition labels, and analyze plate contents via AI.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Nourish/Nourish.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nourish.app
        INFOPLIST_FILE: Nourish/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_ENTITLEMENTS: Nourish/Nourish.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NourishTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NourishTests
    dependencies:
      - target: Nourish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nourish.app.tests
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
